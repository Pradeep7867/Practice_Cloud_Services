
name: Deploy HTML Portfolio to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p site
          cp index.html site/

      - name: Deploy website to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'myPortfolio'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './site'
